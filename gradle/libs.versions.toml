[versions]
agp = "9.3.3"
kotlin = "2.4.0"
composeBom = "2025.09.00"
activityCompose = "1.10.1"
coreKtx = "1.16.0"
lifecycle = "2.9.4"
coroutines = "1.11.0"
workManager = "2.10.0"
healthConnect = "1.1.0-alpha10"
securityCrypto = "1.1.0-alpha06"
zxingEmbedded = "4.3.0"
junit = "4.13.2"
orgJson = "20240303"
androidxTestRunner = "1.6.2"
androidxTestJunit = "1.2.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-work = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }
androidx-health-connect = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
# QR scanning on the phone (ZXing), no Google Play services
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingEmbedded" }
junit = { module = "junit:junit", version.ref = "junit" }
# Android's org.json is a stub in local unit tests; this is the real library
org-json = { module = "org.json:json", version.ref = "orgJson" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
